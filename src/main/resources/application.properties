spring.application.name=demo
server.port=${PORT:8086}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/temple_new_donation}
spring.datasource.username=${DB_USERNAME:temple_app}
spring.datasource.password=${DB_PASSWORD:change_this_password}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-123456789}
app.jwt.expiration-minutes=720
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha